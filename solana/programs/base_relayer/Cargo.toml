[package]
name = "base_relayer"
version = "0.3.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "base_relayer"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "=1.2.1"

[dev-dependencies]
bincode = "1.3"
litesvm = "=0.8.2"
serde_json = "1.0.145"
solana-account = "=3.0.0"
solana-keypair = "=3.0.0"
solana-loader-v3-interface = { version = "=6.1.0", features = ["serde"] }
solana-message = "=3.0.0"
solana-signer = "=3.0.0"
solana-transaction = "=3.0.1"
